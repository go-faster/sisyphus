name: release

# Dispatched (not tag-triggered) so the run's ref is `main`, not the pushed
# tag: GitHub Actions cache is scoped per-ref with no default-branch fallback
# for tags, and a tag ref is used exactly once, so a tag-triggered run could
# never see a warm cache. release-dispatch.yml relays the actual `push:
# tags` event here via `gh workflow run --ref main`, which puts this run on
# main's ref (and its cache) while still checking out the exact tagged
# commit below.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.4.2)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      # --parallelism serializes the build pipe, instead of goreleaser's
      # default of NumCPU (4 here). Six build ids across two arches is twelve
      # jobs, and setup-go's cache means the compiles are mostly warm — what
      # actually ran concurrently was four *links*, each peaking in the
      # multi-GB range for a binary this size. That overran ubuntu-latest's
      # 16 GB from v0.12.0 onward: the runner was killed mid-build three times
      # ("received a shutdown signal", exit 143), always with the same four
      # builds in flight.
      #
      # One semaphore bounds the whole pipe: build.Pipe.Run creates it with
      # ctx.Parallelism and runPipeOnBuild adds a job per *target* to it, so
      # arch is inside the limit, not outside — 1 really is one binary at a
      # time. GOMEMLIMIT is the wrong knob here regardless: it is per process,
      # so concurrent links would each get their own budget and the total stays
      # unbounded, and setting it below what a link needs trades the OOM for a
      # GC death spiral that runs until the timeout.
      - name: Release
        run: goreleaser release --clean --timeout 60m --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
