openapi: 3.0.3
info:
  title: sisyphus API
  description: Hybrid-search internal support assistant.
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe.
      security: []
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /search:
    post:
      operationId: search
      summary: Hybrid (FTS + vector) chunk search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked chunks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/Error"
  /context:
    post:
      operationId: context
      summary: Answer a support question from retrieved context (plan §14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextRequest"
      responses:
        "200":
          description: Constructed answer with sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        default:
          $ref: "#/components/responses/Error"
  /file:
    post:
      operationId: getFile
      summary: Retrieve actual file content from a source repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRequest"
      responses:
        "200":
          description: File content (full or line range).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        default:
          $ref: "#/components/responses/Error"
  /fetch:
    post:
      operationId: fetchURL
      summary: Fetch a URL from an operator-approved site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchURLRequest"
      responses:
        "200":
          description: Fetch result (body + status + metadata).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchURLResponse"
        default:
          $ref: "#/components/responses/Error"
  /notify/enroll:
    post:
      operationId: notifyEnroll
      summary: Upsert a user row for a Telegram user, called on first bot contact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyEnrollRequest"
      responses:
        "200":
          description: Enrollment acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          $ref: "#/components/responses/Error"
  /telegram/peers:
    post:
      operationId: upsertTelegramPeers
      summary: Record Telegram peers the bot has seen, with their current access hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramPeersRequest"
      responses:
        "200":
          description: Peers recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          $ref: "#/components/responses/Error"
  /notify/subscribe:
    post:
      operationId: notifySubscribe
      summary: Subscribe a Telegram user to a source's event types.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifySubscribeRequest"
      responses:
        "200":
          description: Subscription acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          $ref: "#/components/responses/Error"
  /notify/unsubscribe:
    post:
      operationId: notifyUnsubscribe
      summary: Unsubscribe a Telegram user from a source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyUnsubscribeRequest"
      responses:
        "200":
          description: Unsubscription acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          $ref: "#/components/responses/Error"
  /notify/subscriptions/{telegram_user_id}:
    get:
      operationId: notifyListSubscriptions
      summary: List a Telegram user's subscriptions.
      parameters:
        - name: telegram_user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifySubscriptionsResponse"
        default:
          $ref: "#/components/responses/Error"
  /notifications/chats:
    get:
      operationId: listNotifyChats
      summary: List chats registered to receive broadcast notifications.
      responses:
        "200":
          description: Registered chats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyChatsResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: registerNotifyChat
      summary: >-
        Register (or re-enable) a chat as a broadcast destination, or disable
        it. Called by the bot when someone runs /alerts inside the chat, which
        is where the peer's access hash comes from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyChatRequest"
      responses:
        "200":
          description: Registration recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          $ref: "#/components/responses/Error"
  /notifications/pending:
    get:
      operationId: getPendingNotifications
      summary: List pending Telegram-channel notifications, oldest first, for a sink to drain and deliver.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Pending notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingNotificationsResponse"
        default:
          $ref: "#/components/responses/Error"
  /notifications/{id}/ack:
    post:
      operationId: ackNotification
      summary: Record a notification delivery attempt's outcome.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationAckRequest"
      responses:
        "200":
          description: Ack recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
    Error:
      type: object
      required: [error_message]
      properties:
        error_message:
          type: string
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        service:
          type: string
        filters:
          type: object
          description: |
            Metadata filters applied as exact-match against chunk metadata.
            Well-known keys: status, source, jira_project, jira_component,
            jira_key, authority, repo. Values are always strings.
            When source is set here, source_tier/source_prefixes are ignored.
          additionalProperties:
            type: string
        source_tier:
          type: string
          description: |
            Source policy applied when filters.source is absent. Defaults to
            curated. Values: curated (docs, Jira, GitLab issues/MRs/releases,
            manifests), code (code and manifests), history (commits, tags,
            GitLab MRs/issues, Telegram), all (no source restriction).
        source_prefixes:
          type: array
          description: |
            Explicit source prefixes to search when filters.source is absent.
            Overrides source_tier. Prefixes match concrete per-repo sources such
            as git_docs:<repo>, git_code:<repo>, and git_commits:<repo>.
          items:
            type: string
        limit:
          type: integer
          format: int32
          default: 30
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchResult:
      type: object
      required: [chunk_id, document_id, text, score]
      properties:
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        source:
          type: string
        source_url:
          type: string
        title:
          type: string
        chunk_type:
          type: string
        text:
          type: string
        score:
          type: number
          format: double
        vector:
          type: boolean
    ContextRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        service:
          type: string
        filters:
          type: object
          description: |
            Metadata filters applied as exact-match against chunk metadata.
            Well-known keys: status, source, jira_project, jira_component,
            jira_key, authority, repo. Values are always strings.
            When source is set here, source_tier/source_prefixes are ignored.
          additionalProperties:
            type: string
        source_tier:
          type: string
          description: |
            Source policy applied when filters.source is absent. Defaults to
            curated. Values: curated (docs, Jira, GitLab issues/MRs/releases,
            manifests), code (code and manifests), history (commits, tags,
            GitLab MRs/issues, Telegram), all (no source restriction).
        source_prefixes:
          type: array
          description: |
            Explicit source prefixes to search when filters.source is absent.
            Overrides source_tier. Prefixes match concrete per-repo sources such
            as git_docs:<repo>, git_code:<repo>, and git_commits:<repo>.
          items:
            type: string
    ContextResponse:
      type: object
      required: [answer, results]
      properties:
        answer:
          type: string
        confidence:
          type: string
        buttons:
          type: array
          description: |
            Actionable links surfaced alongside the answer (e.g. the sources it
            relied on), suitable for rendering as buttons. URLs are always
            absolute http(s).
          items:
            $ref: "#/components/schemas/Link"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        debug:
          description: |
            Agent-loop diagnostics (trace ID, duration, tool calls, token
            usage), present only when the operator has opted into
            context.show_debug_info.
          $ref: "#/components/schemas/Debug"
    Debug:
      type: object
      description: Agent-loop diagnostics, for debugging only.
      properties:
        trace_id:
          type: string
        duration_ms:
          type: integer
          format: int64
        iterations:
          type: integer
        tool_calls:
          type: integer
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
    Link:
      type: object
      required: [text, url]
      properties:
        text:
          type: string
          description: Human-readable button label.
        url:
          type: string
          description: Absolute http(s) URL.
    FileRequest:
      type: object
      required: [repo, path]
      properties:
        repo:
          type: string
          description: Repository name as recorded in chunk metadata.
        path:
          type: string
          description: Repo-relative file path as recorded in chunk metadata.
        branch:
          type: string
          description: Optional branch (recorded in metadata but not used for lookup).
        start:
          type: integer
          format: int32
          description: Optional 1-indexed start line (inclusive).
        end:
          type: integer
          format: int32
          description: Optional 1-indexed end line (inclusive).
    FileResponse:
      type: object
      required: [content, found]
      properties:
        content:
          type: string
        source:
          type: string
          description: Where the content came from ("local_clone" or "database").
        found:
          type: boolean
    FetchURLRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
        method:
          type: string
          default: GET
        body:
          type: string
          description: Request body for POST/PUT/PATCH (optional).
        headers:
          type: object
          additionalProperties:
            type: string
          description: Additional request headers (optional). Credential headers are set by the server and cannot be overridden.
    FetchURLResponse:
      type: object
      required: [status_code, body, from_site]
      properties:
        status_code:
          type: integer
        body:
          type: string
        from_site:
          type: string
          description: Name of the allowlist site that matched.
        truncated:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
    Ack:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    NotifyEnrollRequest:
      type: object
      required: [telegram_user_id]
      properties:
        telegram_user_id:
          type: integer
          format: int64
    TelegramPeersRequest:
      type: object
      required: [peers]
      properties:
        peers:
          type: array
          items:
            $ref: "#/components/schemas/TelegramPeer"
    TelegramPeer:
      type: object
      required: [peer_type, peer_id]
      properties:
        peer_type:
          type: string
          enum: [user, channel, chat]
        peer_id:
          type: integer
          format: int64
        access_hash:
          type: integer
          format: int64
          description: Absent for a basic group, which needs none. A zero value never overwrites a stored hash.
        username:
          type: string
        title:
          type: string
    NotifySubscribeRequest:
      type: object
      required: [telegram_user_id, source, event_types]
      properties:
        telegram_user_id:
          type: integer
          format: int64
        source:
          type: string
          enum: [gitlab, jira]
        event_types:
          type: array
          items:
            type: string
            description: "mr_assigned, mr_review_requested, mr_commented, mr_mentioned, mr_merged, mr_approved, mr_thread_resolved, mr_conflict (gitlab); issue_assigned, issue_commented, issue_mentioned (jira)."
    NotifyUnsubscribeRequest:
      type: object
      required: [telegram_user_id, source]
      properties:
        telegram_user_id:
          type: integer
          format: int64
        source:
          type: string
          enum: [gitlab, jira]
    NotifySubscription:
      type: object
      required: [source, event_types, enabled]
      properties:
        source:
          type: string
        event_types:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    NotifySubscriptionsResponse:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/NotifySubscription"
    NotifyChatRequest:
      type: object
      required: [peer_type, peer_id, enabled]
      properties:
        peer_type:
          type: string
          enum: [user, channel, chat]
        peer_id:
          type: integer
          format: int64
        title:
          type: string
        added_by:
          type: integer
          format: int64
          description: Telegram user who ran the command, for audit.
        enabled:
          type: boolean
          description: false disables the chat without forgetting it.
    NotifyChat:
      type: object
      required: [peer_type, peer_id, enabled]
      properties:
        peer_type:
          type: string
        peer_id:
          type: integer
          format: int64
        title:
          type: string
        enabled:
          type: boolean
    NotifyChatsResponse:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/NotifyChat"
    PendingNotification:
      type: object
      required: [id, telegram_user_id, telegram_access_hash, text, attempts]
      properties:
        id:
          type: string
          format: uuid
        telegram_user_id:
          type: integer
          format: int64
        telegram_access_hash:
          type: integer
          format: int64
        telegram_peer_type:
          type: string
          description: >-
            What telegram_user_id names. Absent means "user", which is what
            every per-user notification is; broadcasts to an alert chat set
            channel or chat.
          enum: [user, channel, chat]
        text:
          type: string
        buttons:
          type: array
          description: >-
            Inline URL buttons to render under the message. Already validated
            server-side: every URL is absolute http(s) and came from a vetted
            source, never from ingested content.
          items:
            $ref: "#/components/schemas/NotificationButton"
        url:
          type: string
        attempts:
          type: integer
    NotificationButton:
      type: object
      required: [text, url]
      properties:
        text:
          type: string
        url:
          type: string
    PendingNotificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/PendingNotification"
    NotificationAckRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: "delivered or error."
          enum: [delivered, error]
        error:
          type: string
          description: Delivery failure detail (required when status=error).
