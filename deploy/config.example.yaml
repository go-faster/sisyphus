database:
  dsn:
    env: SISYPHUS_DATABASE_DSN

# api: ssapi, the HTTP API server (owns Postgres + migrations). http_addr is
# the address ssapi's own server listens on; base_url/auth_token are read by
# ssbot/ssmcp/ssagent HTTP clients to reach it.
api:
  http_addr: :8080
  base_url: http://ssapi:8080
  auth_token:
    env: SISYPHUS_API_AUTH_TOKEN

# mcp: ssmcp, the MCP server. auth_token is optional bearer auth for /mcp.
mcp:
  addr: :8081
  auth_token:
    env: SISYPHUS_MCP_AUTH_TOKEN

qdrant:
  addr: qdrant:6334
  collection: corp_chunks

ollama:
  url: http://ollama:11434

embed:
  provider: ollama
  model: bge-m3
  dim: 1024

# git: repository content (Markdown docs) + commit messages. Supports N repos;
# each is keyed independently (git_docs:<repo> / git_commits:<repo>).
git:
  work_dir: /data/git
  token:
    env: SISYPHUS_GIT_TOKEN
  repos:
    - url: https://gitlab.example.com/group/docs.git
      repo: docs
      branch: main
      base_url: ""
      # commits: index commit messages on the default branch (default false).
      commits: false
      # tags: index git tags (annotated + lightweight) as documents, source
      # git_tags:<repo> (default false).
      tags: false
      # include/exclude: doublestar globs over repo-relative paths, applied on
      # top of the built-in default skiplist (CLAUDE.md, .github/**, LICENSE*, ...).
      include: []
      exclude: []

# gitlab: GitLab REST API — issues, merge requests, releases (no code diffs).
# Issues/MRs also include assignees/reviewers, MR merge metadata (merged_at/by,
# merge commit, source/target branch), cross-references (closes/relates_to
# links), and comments grouped into discussion threads with resolved state.
gitlab:
  base_url: https://gitlab.example.com
  token:
    env: SISYPHUS_GITLAB_TOKEN
  projects:
    - ref: group/docs # Project ID or path.
  issues: true
  merge_requests: true
  releases: true
  webhook:
    enabled: false
    secret:
      env: SISYPHUS_GITLAB_WEBHOOK_SECRET
  # poll: incremental ingestion on a timer, as a supplement or fallback to
  # webhooks (e.g. GitLab instance can't reach us). 0 disables polling.
  poll:
    interval_seconds: 300
  # conflicts: sweep open MRs for conflicts with their target branch and
  # notify their author/assignees. A separate cadence from poll, because a
  # conflict usually appears when somebody merges into the target branch,
  # which never brings the MR into an updated_after window. 0 disables it.
  conflicts:
    interval_seconds: 900
    lookback_days: 30

# context_files: additional local file sets to index as curated context.
# Include/exclude are doublestar globs over paths relative to root.
context_files:
  - name: runbooks
    root: /data/context/runbooks
    base_url: ""
    include: ["**/*.md", "**/*.txt", "**/*.docx", "**/*.pdf"]
    exclude: []
    authority: high

# convert: turn office documents (Word, PowerPoint, Excel, OpenDocument, RTF,
# EPUB, PDF) found by the context_files walk into Markdown, via the anydoc
# binary. Without it they are skipped for not being text; CSV is skipped either
# way. No OCR, so a scanned PDF is still skipped. Enabling this requires the
# binary (the deploy/Dockerfile image ships /usr/local/bin/anydoc) — ssingest
# fails the files run if it cannot resolve one.
convert:
  enabled: false
  binary: anydoc
  timeout_seconds: 30
  max_output_bytes: 8388608

proxies:
  git:
    env: SISYPHUS_GIT_PROXY
  gitlab:
    env: SISYPHUS_GITLAB_PROXY
  jira:
    env: SISYPHUS_JIRA_PROXY
  ollama:
    env: SISYPHUS_OLLAMA_PROXY
  openrouter:
    env: SISYPHUS_OPENROUTER_PROXY

# fetch: operator-approved URL allowlist for the agentic /context and
# /investigate loops' fetch_url tool. url_patterns are doublestar globs
# matched against the full URL; add a site per external system the agent is
# allowed to reach (e.g. GitLab, so it doesn't have to rely on search_knowledge
# alone for pages that aren't ingested yet).
fetch:
  sites:
    - name: gitlab
      url_patterns:
        - "https://gitlab.example.com/**"
      methods: [GET]

jira:
  base_url: ""
  email: ""
  username: ""
  api_token:
    env: SISYPHUS_JIRA_APITOKEN
  password:
    env: SISYPHUS_JIRA_PASSWORD
  pat:
    env: SISYPHUS_JIRA_PAT
  projects: []
  webhook:
    enabled: false
    secret:
      env: SISYPHUS_JIRA_WEBHOOK_SECRET
  # poll: incremental ingestion on a timer, as a supplement or fallback to
  # webhooks. 0 disables polling.
  poll:
    interval_seconds: 300

openrouter:
  api_key:
    env: SISYPHUS_OPENROUTER_API_KEY
  model: openai/gpt-4o-mini
  # reasoning_effort: requests OpenRouter's unified reasoning mode
  # (low/medium/high). Unset leaves it up to whichever upstream provider
  # OpenRouter routes the request to — some emit no reasoning at all
  # regardless of this setting.
  # reasoning_effort: low

# context: agentic /context workflow settings.
context:
  agentic: false
  max_iterations: 6
  timeout_seconds: 180
  max_answer_chars: 2000
  ssh_mcp_url: ""
  ssh_mcp_headers: {}
  sandbox_machine: sandbox
  pre_search: true
  pre_search_limit: 12

# telegram: ssbot. addr is the address ssbot's standalone health/ready HTTP
# server listens on (ssbot has no primary HTTP API of its own).
telegram:
  addr: :8083
  app_id: 0
  app_hash:
    env: SISYPHUS_TELEGRAM_APP_HASH
  bot_token:
    env: SISYPHUS_TELEGRAM_BOT_TOKEN
  session_dir: /data/scp/session
  monitor_chats: []
  ingest_session: ""
  # allowed_chats and allowed_user_ids: fail-closed allowlist for the bot.
  # If both are empty, the bot will not respond to anyone and log a warning.
  # List chat IDs (can be negative for groups/channels) and user IDs separately.
  allowed_chats: []
  allowed_user_ids: []

# notify: the notification gateway.
#
# poll.interval_seconds is ssbot's outbox drain interval; 0 (the default)
# disables delivery entirely, alert reports included.
#
# identities maps Telegram users to the GitLab/Jira accounts events are
# addressed to, and is the only way that mapping is made: whoever holds a
# GitLab username receives every notification sent to it, and nothing a user
# types over Telegram proves the account is theirs. ssapi reconciles the list
# on startup, so removing an entry revokes it. Each entry needs telegram_id
# plus at least one of gitlab/jira.
#
# max_assignment_age_seconds is how old an assignment (or review request) may
# be and still notify. Source events state *current* membership, not a change
# to it, so without a cutoff any edit to a long-assigned issue re-announces
# that assignment — which is what a fresh outbox, or a user who just got an
# identity, sees a burst of. Unset means 24h; negative disables the check.
notify:
  poll:
    interval_seconds: 15
  # max_assignment_age_seconds: 86400
  # send_interval_ms is the pause between two sends, so a burst of events
  # arrives as a readable sequence instead of a wall of messages. 0 uses the
  # 300ms default; negative sends without pacing.
  # send_interval_ms: 300
  # ignore_comment_authors silences comments from automation accounts, which
  # comment on every object a rule touches. Their assignments still notify.
  ignore_comment_authors: []
  # ignore_comment_authors:
  #   - source: jira
  #     key: "557058:1111-1111"
  #   - source: gitlab
  #     key: automation
  identities: []
  # identities:
  #   - telegram_id: 123456789
  #     gitlab: a.example
  #     jira: "557058:0000-0000"
  #     jira_display: "A. Example"

# agent: ssagent, the on-demand investigation service. base_url is read by
# ssbot to reach ssagent for the /investigate command (leave empty to disable
# /investigate in ssbot). gateway_url points at the mcpgateway instance that
# fans out to Grafana/Alertmanager/Jira/GitLab/knowledge-base MCP servers.
# /investigate jobs are persisted in Postgres (database.dsn, required):
# ssagent connects to it but never runs migrations itself, so ssapi must have
# applied them first.
agent:
  addr: :8082
  base_url: http://ssagent:8082
  auth_token:
    env: SISYPHUS_AGENT_AUTH_TOKEN
  model: openai/gpt-4o
  max_tool_iterations: 8
  request_timeout_seconds: 180
  gateway_url: http://mcpgateway:8090/mcp
  # Character budget for the assembled report; if the model's first
  # submit_report exceeds this, it's asked once to resubmit a shorter one.
  max_report_chars: 1500
  # Caps how many investigations run concurrently; each one holds an LLM
  # tool-calling loop open for up to request_timeout_seconds. /investigate is
  # async (202 + job ID, persisted in Postgres via database.dsn - ssagent
  # connects but does not migrate), so extra requests aren't rejected: the
  # job is accepted and queued as pending until a worker slot frees up.
  max_concurrent: 4
  # Request body size cap in bytes for POST /investigate.
  max_body_bytes: 65536

# maintenance: `ssingest maint`, the periodic upkeep daemon. It is the
# stand-in for CronJobs, which compose has no equivalent of, so the schedule
# lives in the process. Every job here is also a one-shot subcommand
# (`ssingest gc`, `ssingest repair`) and both take the same advisory lock, so a
# scheduled sweep and a hand-run one never overlap.
#
# Setting an interval to 0 disables that job. The values below are the
# defaults; the whole section can be omitted.
maintenance:
  addr: :8085
  # Delay before the first pass of each job. Jobs do not wait a full interval
  # for their first run — a deployment that restarts daily would then never
  # reach a daily job — so this is what stops a crash loop from re-scanning the
  # vector store on every restart.
  start_delay: 5m
  # How long shutdown waits for an in-flight sweep. A sweep holds no state and
  # the next run re-finds its work, so it is abandoned rather than awaited.
  drain_timeout: 30s
  # gc: delete vector points no chunk references. Daily, because points only
  # leak when the cleanup during indexing fails after its transaction has
  # committed, and each sweep costs a full scan of the vector store.
  gc:
    interval: 24h
    # How long a point must look orphaned before it is deleted. Do not shorten
    # this casually: a document mid-index has its points written before its
    # chunk rows commit, and deleting one of those is unrecoverable.
    grace: 5m
    batch: 1024
  # repair: rebind chunks whose point is keyed by the wrong ID. Weekly and in
  # small batches, because every repaired row costs an embedding call and that
  # capacity is shared with ingestion.
  repair:
    interval: 168h
    batch: 64
  # reap_stale: settle queue jobs whose attempts are spent and whose lease has
  # lapsed — a worker that died holding a claim. Until settled they are
  # invisible to a claim but indistinguishable from real backlog.
  reap_stale:
    interval: 5m
  # queue_retention: delete settled queue_jobs rows. Nothing else removes them,
  # and every job costs at least two UPDATEs, so the table accumulates rows and
  # dead tuples for the life of the deployment.
  #
  # Two windows, because the statuses mean different things: a done row is an
  # audit trail nobody reads, an error row is why someone opens the table.
  # Either can be 0 to keep that status forever. Only terminal rows are ever
  # eligible — pending and running jobs are outstanding work at any age.
  queue_retention:
    interval: 1h
    done_after: 72h
    error_after: 720h
    # Deleting in batches, capped per sweep: an unbounded DELETE on a churn
    # table takes a long lock and bloats WAL. Whatever is left over goes in the
    # next sweep; a run that reports capped=true every time wants a bigger batch.
    batch: 5000
    max_batches: 20
  # notify_retention: the same growth in the notifications table, at a lower
  # rate — one row per delivery rather than per job. Longer window, because the
  # row is the operator-facing record of what was actually sent.
  notify_retention:
    interval: 24h
    after: 2160h
    batch: 5000
    max_batches: 20
